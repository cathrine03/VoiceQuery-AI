services:
  postgres:
    image: postgres:16

    container_name: voicequery_postgres

    environment:
      POSTGRES_USER: voicequery_user
      POSTGRES_PASSWORD: voicequery_password
      POSTGRES_DB: voicequery_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: